<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HALOFLUX · 实时光环</title>
<style>
  html, body { margin: 0; height: 100%; background: #08090b; overflow: hidden; }
</style>
</head>
<body>
<script type="module">
  import { createHaloflux } from '../src/engine/index.js';
  import { createShell } from '../src/ui/shell.js';
  import { createSimulatedSource } from '../src/data/simulate.js';

  const q = new URLSearchParams(location.search);

  const canvas = document.createElement('canvas');
  document.body.appendChild(canvas);

  const halo = createHaloflux(canvas, {
    seed: Number(q.get('seed') || 1),
    quality: q.get('quality') || 'high',
    hud: q.get('hud') === '1',
    params: (() => {
      const o = {};
      for (const pair of (q.get('params') || '').split(',').filter(Boolean)) {
        const [k, v] = pair.split(':');
        o[k] = Number(v);
      }
      return o;
    })(),
    source: q.get('data') === 'none' ? null : createSimulatedSource()
  });

  const shell = createShell({
    canvas,
    engine: halo,
    panels: q.get('panels') !== '0',
    onToggle: (v) => console.log(`[haloflux] 面板 ${v ? '显示' : '隐藏'}（P 键切换）`)
  });

  window.__halo = halo;
  window.__shell = shell;

  // keyboard extras (P / F are owned by the shell)
  window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') halo.stop();
    if (e.key === 's' || e.key === 'S') halo.start();
  });
</script>
</body>
</html>
